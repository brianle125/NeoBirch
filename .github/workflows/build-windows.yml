name: Build NeoBirch (Windows)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install conan
        run: |
          pip install conan
      
      - name: Create default Conan profile
        run: conan profile detect --force

      - name: Show Conan profile
        run: conan profile show -pr default

      - name: Cache Conan Dependencies
        id: cache-conan
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.USERPROFILE }}\.conan2\p 
          key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install dependencies (Windows)
        run: conan install . --build=missing --output-folder build -c tools.cmake.cmaketoolchain:generator=Ninja -vv

      - name: Set up MSVC environment variables
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      
      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Inspect Conan output
        run: dir build

      - name: Build (Windows)
        run: cmake --build build --preset conan-release
